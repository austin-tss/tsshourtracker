<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#ffffff">
<title>TSShourtracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand2:#4f46e5;--ok:#059669;--bad:#dc2626;--r:20px;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);--f:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
header b{font-size:17px}header small{display:block;color:var(--mute);font-size:12px;margin-top:-2px}
header .sp{flex:1}.link{background:none;border:0;color:var(--brand);font:600 14px var(--f);padding:8px}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:14px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}.mute{color:var(--mute);font-size:14px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1;transition:.2s}.dots i.f{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:64px;border:0;border-radius:18px;background:#f1f5f9;font:600 24px var(--f);color:var(--ink);transition:transform .08s,background .15s}
.pad button:active{transform:scale(.94);background:#e2e8f0}.pad .ghost{background:transparent;font-size:16px;color:var(--mute)}
.big{width:100%;height:76px;border:0;border-radius:22px;font:800 22px var(--f);color:#fff;letter-spacing:.01em;transition:transform .1s,opacity .2s;box-shadow:0 10px 24px -8px currentColor}
.big:active{transform:scale(.98)}.big:disabled{opacity:.6}
.in{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.out{background:linear-gradient(135deg,#ef4444,#dc2626)}
.big span{color:#fff}
.status{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(5,150,105,.5);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}
.timer{font:800 52px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.jobs{display:grid;gap:10px;margin:14px 0 16px}
.job{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;font:600 16px var(--f);text-align:left;transition:.15s}
.job.sel{border-color:var(--brand);background:#eff6ff}.job .ic{width:38px;height:38px;border-radius:12px;background:#e0e7ff;display:grid;place-items:center;font-size:18px}
.job .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}.job.sel .ck{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#f8fafc;border-radius:14px;padding:10px}.stat b{display:block;font-size:20px}.stat small{color:var(--mute);font-size:12px}
.bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .8s ease}
.bar.ot i{background:linear-gradient(90deg,#f59e0b,#ea580c)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#eef2ff;border:0;padding:0;font:inherit;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover}.tile .lbl{position:absolute;inset:auto 0 0 0;padding:10px;background:linear-gradient(transparent,rgba(15,23,42,.75));color:#fff}
.tile .lbl b{display:block}.tile.empty{display:grid;place-items:center;color:var(--brand);font-weight:700}.tile.empty .lbl{background:none;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:12px}.add input{flex:1;min-width:0;height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 17px var(--f);outline:0}.add input:focus{border-color:var(--brand)}
.btn{height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--brand);color:#fff;font:700 15px var(--f)}.btn.sec{background:#f1f5f9;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}


.shift{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
details summary{cursor:pointer;list-style:none;font-weight:700}details summary::-webkit-details-marker{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;z-index:20;max-width:90vw}
#toast.on{transform:translate(-50%,0);opacity:1}#toast.err{background:var(--bad)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px}
.spin.dk{border-color:#cbd5e1;border-top-color:var(--brand)}@keyframes r{to{transform:rotate(360deg)}}
.up{position:sticky;top:64px;z-index:4}
</style></head><body>
<header><div class="logo">TSS</div><div><b>Hour Tracker</b><small>TechSource Solutions</small></div><div class="sp"></div><button class="link" id="lo" style="display:none" onclick="location.reload()">Log out</button></header>
<main id="m"></main><div id="toast"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbzhTrysR8UYQyUpWiI-5BbZdNZpAdWzTsMpIB-6aB7m_4324AiYSoy4FlCKtVc1hqo9GA/exec';
const MOCK=new URLSearchParams(location.search).has('mock');
let code='',S=null,job=null,tick=null,mname='';const $=id=>document.getElementById(id);const m=$('m');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function toast(t,err){const e=$('toast');e.textContent=t;e.className='on'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2600);}
async function call(body){if(MOCK)return mock(body);const r=await fetch(API,{method:'POST',body:JSON.stringify(body)});const j=await r.json();if(j.error)throw Error(j.error);return j;}
function mock(b){const t=new Date(Date.now()-(2*3600+17*60)*1000).toISOString();if(b.action==='master')return{master:'WT Moore'};if(b.action==='photo')return{ok:true};
 return{name:'William Griffin',rate:30,jobs:['WT Moore'],open:{job:'WT Moore',in:'Sat Oct 24, 7:02 AM ET',inIso:t},weeks:[{week:weekNow(),hours:31.5,regular:31.5,overtime:0,pay:945,shifts:[{job:'WT Moore',in:'Fri Oct 23, 7:00 AM ET',out:'Fri Oct 23, 3:30 PM ET',hours:8.5}]}]};}
function weekNow(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 const d=new Date(Date.UTC(+p.year,p.month-1,+p.day));const back=(['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(p.weekday));d.setUTCDate(d.getUTCDate()-back);return d.toISOString().slice(0,10);}
// ---------- Login keypad ----------
function loginView(){m.innerHTML=`<div class="card" style="text-align:center;padding:28px 20px"><h2>Welcome back</h2><div class="mute">Enter your employee code</div>
<div class="dots" id="dots">${'<i></i>'.repeat(4)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}
<button class="ghost" onclick="key('c')">Clear</button><button onclick="key('0')">0</button><button class="ghost" onclick="key('b')">⌫</button></div></div>`;}
async function key(k){if(k==='c')code='';else if(k==='b')code=code.slice(0,-1);else if(code.length<4)code+=k;
 [...$('dots').children].forEach((d,i)=>d.className=i<code.length?'f':'');if(code.length===4){$('dots').innerHTML='<span class="spin dk"></span>';
 try{S=await call({action:'status',code});$('lo').style.display='';render();uploadAll();}catch(e){code='';loginView();$('dots').classList.add('shake');toast(e.message,1);}}}
// ---------- Main ----------
function fmtT(ms){const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');}
function render(){clearInterval(tick);const first=S.name.split(' ')[0];const w=S.weeks.find(x=>x.week===weekNow());
 let h=`<div class="up" id="up"></div><div class="card"><div class="row"><div><div class="mute">Hi ${esc(first)} 👋</div><h2>${S.open?'You’re on the clock':'Ready to start?'}</h2></div><span class="chip">$${S.rate}/hr</span></div>`;
 if(S.open){h+=`<div class="status" style="margin-top:14px"><span class="pulse"></span>${esc(S.open.job)} · since ${esc(S.open.in.replace(/^\w+ \w+ \d+, /,''))}</div><div class="timer" id="tm">00:00:00</div><div class="mute" style="margin-bottom:16px">Current shift</div>
  <button class="big out" id="pb" onclick="punch()">Clock out</button></div><div class="card" id="rooms"><div class="spin dk"></div></div>`;}
 else{if(!job)job=S.jobs[0];h+=`<div class="mute" style="margin-top:14px">Choose your job</div><div class="jobs">${S.jobs.map(j=>`<button class="job ${j===job?'sel':''}" onclick="job='${esc(j)}';render()"><span class="ic">🏫</span>${esc(j)}<span class="ck"></span></button>`).join('')}</div>
  <button class="big in" id="pb" onclick="punch()">Clock in</button></div>`;}
 const hrs=w?w.hours:0,pct=Math.min(100,hrs/40*100);
 h+=`<div class="card"><div class="row"><h2 style="font-size:17px">This week</h2><span class="mute">Mon–Sun</span></div><div class="stats"><div class="stat"><b>${hrs.toFixed(1)}</b><small>hours</small></div><div class="stat"><b>${(w?w.overtime:0).toFixed(1)}</b><small>overtime</small></div><div class="stat"><b>$${(w?w.pay:0).toFixed(0)}</b><small>gross pay</small></div></div>
 <div class="bar ${hrs>40?'ot':''}"><i style="width:0" data-w="${pct}"></i></div><div class="row mute" style="margin-top:6px;font-size:13px"><span>${hrs>=40?'Overtime pays 1.5× now':(40-hrs).toFixed(1)+' h to overtime'}</span><span>40 h</span></div></div>`;
 if(S.weeks.length)h+=`<div class="card"><details><summary class="row">History <span class="mute">${S.weeks.length} week${S.weeks.length>1?'s':''} ▾</span></summary>${S.weeks.map(x=>`<div style="margin-top:14px"><div class="row"><b>Week of ${x.week}</b><b>$${x.pay.toFixed(2)}</b></div><div class="mute" style="font-size:13px">${x.hours} h · reg ${x.regular} · OT ${x.overtime}</div>${x.shifts.map(s=>`<div class="shift"><span>${esc(s.job)}<br><span class="mute">${esc(s.in)} → ${esc(s.out.replace(/^\w+ \w+ \d+, /,''))}</span></span><b>${s.hours} h</b></div>`).join('')}</div>`).join('')}</details></div>`;
 m.innerHTML=h;requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'));
 if(S.open){const t0=new Date(S.open.inIso).getTime(),f=()=>{const e=$('tm');if(e)e.textContent=fmtT(Date.now()-t0);};f();tick=setInterval(f,1000);renderRooms();}}
async function punch(){const b=$('pb'),wasOpen=S.open,lbl=b.textContent;b.disabled=true;b.innerHTML='<span class="spin"></span>';
 try{const n=wasOpen?(await allPhotos()).filter(p=>p.code===code&&p.inIso===wasOpen.inIso).length:0;S=await call({action:'punch',code,job,photos:n});render();toast(wasOpen?'Clocked out ✓':'Clocked in ✓');if(wasOpen)uploadAll();}
 catch(e){b.disabled=false;b.textContent=lbl;toast(e.message,1);}}
// ---------- Photo storage (IndexedDB, never the gallery) ----------
const DB=new Promise((ok,no)=>{const r=indexedDB.open('tsshours',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('rooms',{keyPath:'k'});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
async function tx(st,mode,fn){const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(st,mode),s=t.objectStore(st);const q=fn(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);});}
const allPhotos=()=>tx('photos','readonly',s=>s.getAll());
const sessKey=()=>code+'|'+(S&&S.open?S.open.inIso:'');
async function rooms(){const r=await tx('rooms','readonly',s=>s.get(sessKey()));return r?r.list:[];}
async function addRoom(){const n=$('roomNo').value.trim().replace(/[^\w .-]/g,'');if(!n)return toast('Enter a room number',1);const l=await rooms();if(!l.includes(n))l.push(n);await tx('rooms','readwrite',s=>s.put({k:sessKey(),list:l}));openRoom(n);}
async function renameM(){const n=prompt('Drive folder name for '+S.open.job+' (e.g. the school):',mname);if(!n)return;try{const r=await call({action:'master',code,job:S.open.job,name:n});mname=r.master;$('mname').textContent=mname;toast('Folder renamed ✓');}catch(e){toast(e.message,1);}}
let cur=null;
async function renderRooms(){const el=$('rooms');if(!el||!S.open)return;if(!mname){try{mname=(await call({action:'master',code,job:S.open.job})).master;}catch(e){mname=S.open.job;}}
 const ph=(await allPhotos()).filter(p=>p.inIso===S.open.inIso),l=await rooms();
 el.innerHTML=`<div class="row"><h2 style="font-size:17px">Rooms</h2><button class="chip" style="border:0" onclick="renameM()">📁 <span id="mname">${esc(mname)}</span> ✎</button></div><div class="mute" style="font-size:13px">Photos stay in this app and upload to Drive when you clock out.</div>
 <div class="add"><input id="roomNo" inputmode="numeric" placeholder="Room number" onkeydown="if(event.key==='Enter')addRoom()"><button class="btn" onclick="addRoom()">Add</button></div>
 <div class="tiles">${l.map(r=>{const n=ph.filter(p=>p.room===r).length;return `<button class="tile empty" onclick="openRoom('${esc(r)}')">${n?'🗂️':'📷'}<span class="lbl" style="position:absolute"><b>Room ${esc(r)}</b>${n?n+' photo'+(n>1?'s':'')+' saved':'No photos yet'}</span></button>`;}).join('')}</div>`;}
async function openRoom(r){cur=r;const n=(await allPhotos()).filter(p=>p.inIso===S.open.inIso&&p.room===r).length;
 $('rooms').innerHTML=`<div class="row"><button class="link" style="padding:0" onclick="renderRooms()">‹ Rooms</button></div><h2 style="margin:6px 0 4px">Room ${esc(r)}</h2>
 <div class="mute" id="pc" style="margin-bottom:14px">${n?n+' photo'+(n>1?'s':'')+' saved · uploads at clock-out':'No photos yet'}</div>
 <label class="btn" style="display:inline-flex;align-items:center;gap:8px;line-height:50px">📷 Take Photo<input type="file" accept="image/*" capture="environment" hidden onchange="fileShot(this)"></label>`;}
async function toJpeg(src,w,h){const k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',0.82));}
async function save(blob){await tx('photos','readwrite',s=>s.add({code,inIso:S.open.inIso,room:cur,takenAt:new Date().toISOString(),blob}));const n=(await allPhotos()).filter(p=>p.inIso===S.open.inIso&&p.room===cur).length;toast('Photo '+n+' saved for Room '+cur);openRoom(cur);}
async function fileShot(i){const f=i.files[0];if(!f)return;try{const b=await createImageBitmap(f,{imageOrientation:'from-image'});await save(await toJpeg(b,b.width,b.height));}catch(e){toast('Could not save photo: '+e.message,1);}i.value='';}
const b64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(b);});
let uploading=false;
function upMsg(t,pct){const e=$('up');if(e)e.innerHTML=t?`<div class="card" style="padding:14px"><div class="row" style="font-size:14px;font-weight:600"><span>${t}</span>${pct<100?'<span class="spin dk"></span>':'✅'}</div><div class="bar" style="margin-top:8px"><i style="width:${pct}%"></i></div></div>`:'';}
async function uploadAll(){if(uploading)return;uploading=true;let tries=0;const pend=p=>p.code===code&&!(S.open&&p.inIso===S.open.inIso);
 while(true){const ph=(await allPhotos()).filter(pend);if(!ph.length){if(tries){upMsg('All photos uploaded to Drive',100);toast('Photos uploaded ✓');setTimeout(()=>upMsg(''),4000);}break;}
  let done=0;for(const p of ph){upMsg(`Uploading photos ${done}/${ph.length} · keep this open`,done/ph.length*100);
   try{await call({action:'photo',code,inIso:p.inIso,room:p.room,takenAt:p.takenAt,seq:p.id,data:await b64(p.blob)});await tx('photos','readwrite',s=>s.delete(p.id));done++;}catch(e){}}
  tries++;const left=(await allPhotos()).filter(pend).length;if(left){const w=Math.min(60,5*tries);upMsg(`${left} photo${left>1?'s':''} failed · retrying in ${w}s`,done/ph.length*100);await new Promise(r=>setTimeout(r,w*1000));}}
 uploading=false;}
loginView();
if(MOCK){code='7340';call({}).then(async s=>{S=s;$('lo').style.display='';await tx('rooms','readwrite',x=>x.put({k:sessKey(),list:['101','102','204']}));
 const c=document.createElement('canvas');c.width=400;c.height=400;const g=c.getContext('2d');for(const [r,col] of [['101','#93c5fd'],['204','#fcd34d']]){const gr=g.createLinearGradient(0,0,400,400);gr.addColorStop(0,col);gr.addColorStop(1,'#e2e8f0');g.fillStyle=gr;g.fillRect(0,0,400,400);
 const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg'));await tx('photos','readwrite',x=>x.add({code,inIso:S.open.inIso,room:r,takenAt:new Date().toISOString(),blob}));}render();}).catch(e=>{document.title="ERR "+e.message;});}
</script></body></html>
