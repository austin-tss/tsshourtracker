<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light only"><meta name="theme-color" content="#ffffff">
<title>TSShourtracker</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#0f172a;--mute:#64748b;--line:#e2e8f0;--brand:#2563eb;--brand2:#4f46e5;--ok:#059669;--bad:#dc2626;--r:20px;--sh:0 1px 2px rgba(15,23,42,.04),0 8px 24px rgba(15,23,42,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}body{margin:0;background:var(--bg);color:var(--ink);--f:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;letter-spacing:.5px}
header b{font-size:17px}header small{display:block;color:var(--mute);font-size:12px;margin-top:-2px}
header .sp{flex:1}.link{background:none;border:0;color:var(--brand);font:600 14px var(--f);padding:8px}
main{max-width:480px;margin:0 auto;padding:0 16px calc(32px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:20px;margin-bottom:12px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h2{margin:0 0 4px;font-size:20px;letter-spacing:-.01em}.mute{color:var(--mute);font-size:14px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid #cbd5e1;transition:.2s}.dots i.f{background:var(--brand);border-color:var(--brand);transform:scale(1.1)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:64px;border:0;border-radius:18px;background:#f1f5f9;font:600 24px var(--f);color:var(--ink);transition:transform .08s,background .15s}
.pad button:active{transform:scale(.94);background:#e2e8f0}.pad .ghost{background:transparent;font-size:16px;color:var(--mute)}
.big{width:100%;height:76px;border:0;border-radius:22px;font:800 22px var(--f);color:#fff;letter-spacing:.01em;transition:transform .1s,opacity .2s;box-shadow:0 10px 24px -8px currentColor}
.big:active{transform:scale(.98)}.big:disabled{opacity:.6}
.in{background:linear-gradient(135deg,#10b981,#059669);color:#fff}.out{background:linear-gradient(135deg,#ef4444,#dc2626)}
.big span{color:#fff}
.status{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px}.pulse{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 rgba(5,150,105,.5);animation:p 1.6s infinite}
@keyframes p{70%{box-shadow:0 0 0 10px rgba(5,150,105,0)}100%{box-shadow:0 0 0 0 rgba(5,150,105,0)}}
.timer{font:800 52px/1.1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:-.02em;margin:10px 0 2px;font-variant-numeric:tabular-nums}
.jobs{display:grid;gap:10px;margin:14px 0 16px}
.job{display:flex;align-items:center;gap:12px;padding:14px;border:2px solid var(--line);border-radius:16px;background:#fff;font:600 16px var(--f);text-align:left;transition:.15s}
.job.sel{border-color:var(--brand);background:#eff6ff}.job .ic{width:38px;height:38px;border-radius:12px;background:#e0e7ff;display:grid;place-items:center;font-size:18px}
.job .ck{margin-left:auto;width:22px;height:22px;border-radius:50%;border:2px solid var(--line)}.job.sel .ck{background:var(--brand);border-color:var(--brand);box-shadow:inset 0 0 0 3px #fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#f8fafc;border-radius:14px;padding:10px}.stat b{display:block;font-size:20px}.stat small{color:var(--mute);font-size:12px}
.bar{height:10px;border-radius:99px;background:#e2e8f0;overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .8s ease}
.bar.ot i{background:linear-gradient(90deg,#f59e0b,#ea580c)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tile{position:relative;aspect-ratio:4/3;border-radius:16px;overflow:hidden;background:#eef2ff;border:0;padding:0;font:inherit;text-align:left}
.tile img{width:100%;height:100%;object-fit:cover}.tile .lbl{position:absolute;inset:auto 0 0 0;padding:10px;background:linear-gradient(transparent,rgba(15,23,42,.75));color:#fff}
.tile .lbl b{display:block}.tile.empty{display:block;color:var(--brand);font-weight:700;font-size:24px;padding:12px;background:#f5f7ff;border:1px solid #e0e7ff}.tile .lbl{font-size:13px;font-weight:500;line-height:1.3}.tile .lbl b{font-size:15px;font-weight:700;color:var(--ink)}.tile.empty .lbl{background:none;color:var(--mute)}
.add{display:flex;gap:8px;margin-top:12px}.add input{flex:1;min-width:0;height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:600 17px var(--f);outline:0}.add input:focus{border-color:var(--brand)}
.btn{height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--brand);color:#fff;font:700 15px var(--f)}.btn.sec{background:#f1f5f9;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f1f5f9;border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}


.shift{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
details summary{cursor:pointer;list-style:none;font-weight:700}details summary::-webkit-details-marker{display:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,40px);opacity:0;background:#0f172a;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;transition:.3s;z-index:20;max-width:90vw}
#toast.on{transform:translate(-50%,0);opacity:1}#toast.err{background:var(--bad)}
.spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-3px}
.spin.dk{border-color:#cbd5e1;border-top-color:var(--brand)}@keyframes r{to{transform:rotate(360deg)}}
.up:empty{display:none}.up{margin:12px 0 0}.upb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:var(--sh);font-size:13px;font-weight:600;position:relative;overflow:hidden}.upb.err{background:#fff7ed;color:#9a3412;box-shadow:none;border:1px solid #fed7aa}.upb .tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.upb .link{padding:0;font-size:13px;white-space:nowrap}.upb .pg{position:absolute;left:0;bottom:0;height:3px;background:var(--brand);transition:width .4s}.upb.err .pg{background:#fb923c}
.empty-st{text-align:center;padding:20px 12px 8px;color:var(--mute);font-size:14px}.empty-st .ei{width:48px;height:48px;margin:0 auto 8px;border-radius:14px;background:#eef2ff;display:grid;place-items:center;font-size:22px}.empty-st b{display:block;color:var(--ink);font-size:15px}
.field{width:100%;height:50px;border:2px solid var(--line);border-radius:14px;padding:0 14px;font:500 16px var(--f);outline:0;margin-bottom:12px;background:#fff}.field:focus{border-color:var(--brand)}
.dn{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:8px;font-size:12px;color:var(--mute);text-align:center;line-height:1.3}.dn.sm{margin-top:6px;font-size:11px}
.sub{font-size:13px;color:var(--mute);margin-bottom:12px}
.msg{border-radius:16px;padding:12px 14px;margin:10px 0;font-size:15px;animation:in .3s ease both}.msg.u{background:#eff6ff;margin-left:28px}.msg.a{background:#f8fafc;border:1px solid var(--line)}
.msg.a ul,.msg.a ol{padding-left:20px;margin:6px 0}.msg.a p{margin:6px 0}.msg.a h4{margin:10px 0 4px}.msg.a code{background:#e2e8f0;border-radius:6px;padding:1px 5px}
textarea{width:100%;min-height:96px;border:2px solid var(--line);border-radius:14px;padding:12px;font:16px var(--f);resize:vertical;outline:0}textarea:focus{border-color:var(--brand)}
.tabbar{position:sticky;top:calc(59px + env(safe-area-inset-top));z-index:4;margin:0 -16px;padding:10px 16px;background:rgba(244,246,251,.92);backdrop-filter:blur(12px)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:#e2e8f0;border-radius:14px;padding:4px}.tabs button{height:42px;font-size:13px!important;border:0;border-radius:11px;background:transparent;white-space:nowrap;padding:0 4px;font:700 14px var(--f);color:var(--mute)}.tabs button span{margin-right:5px}.tabs button.on{background:#fff;color:var(--ink);box-shadow:var(--sh)}
.mic{width:50px;height:50px;border:0;border-radius:14px;background:#f1f5f9;font-size:20px}.mic.on{background:#ef4444;animation:mp 1.2s infinite}@keyframes mp{0%{box-shadow:0 0 0 0 rgba(239,68,68,.55)}70%{box-shadow:0 0 0 12px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}.tools{display:grid;grid-template-columns:1fr 1fr 50px 1fr;gap:8px;margin-top:10px}.tools .btn{display:flex;align-items:center;justify-content:center;gap:4px;padding:0 6px;white-space:nowrap;font-size:15px;cursor:pointer}.tools .mic{width:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chips:empty{display:none}.chip a{color:var(--mute);text-decoration:none;margin-left:2px}.err-box{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border-radius:14px;background:#fef2f2;color:#991b1b;font-size:14px;font-weight:600}</style></head><body>
<header><div class="logo">TSS</div><div><b>Hour Tracker</b><small>TechSource Solutions</small></div><div class="sp"></div><button class="link" id="lo" style="display:none" onclick="location.reload()">Log out</button></header>
<main id="m"></main><div id="toast"></div>
<script>
// ===== Links tab: edit this list to add/remove links =====
// ios/android: native app deep links tried in order first; url = web fallback
// ===== Checklists: add templates here =====
const CHECKLISTS={
 'Default AE checklist':['Amp installed','4 speakers installed','Service loop above ceiling','Picture of call button installed'],
};
const LINKS=[
 {icon:'📍',label:'Directions to WT Moore',sub:'Open in Maps',ios:['comgooglemaps://?daddr=W.T.+Moore+Elementary+School&directionsmode=driving','maps://?daddr=W.T.+Moore+Elementary+School'],android:['google.navigation:q=W.T.+Moore+Elementary+School'],url:'https://www.google.com/maps/search/?api=1&query=W.T.+Moore+Elementary+School'},
 {icon:'☑️',label:'Checklist',sub:'Room photos by checklist',tab:'checklist'},
 {icon:'🧾',label:'Receipts',sub:'Snap & upload a receipt',tab:'receipts'}, // tab: opens an in-app tab
 {icon:'🗺️',label:'Google Maps',sub:'maps.google.com',ios:['comgooglemaps://'],url:'https://maps.google.com'},
 {icon:'📁',label:'TSS Google Drive',sub:'drive.google.com',ios:['googledrive://'],android:['intent://#Intent;package=com.google.android.apps.docs;scheme=googledrive;S.browser_fallback_url='+encodeURIComponent('https://drive.google.com')+';end'],url:'https://drive.google.com'},
];
function openLink(i){const l=LINKS[i],ua=navigator.userAgent;
 const isIOS=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1),isAnd=/Android/.test(ua);
 const chain=[...((isIOS?l.ios:isAnd?l.android:null)||[]),l.url];let t,k=0,gone=false;
 const stop=()=>{gone=true;clearTimeout(t)};
 const vis=()=>{if(document.hidden)stop()};
 document.addEventListener('visibilitychange',vis);addEventListener('pagehide',stop,{once:true});addEventListener('blur',stop,{once:true});
 const done=()=>{document.removeEventListener('visibilitychange',vis);removeEventListener('pagehide',stop);removeEventListener('blur',stop)};
 const step=()=>{if(gone)return done();const u=chain[k++];if(k>=chain.length){done();if(chain.length===1)window.open(u,'_blank','noopener');else location.href=u;return}
  location.href=u;t=setTimeout(step,1200)};
 step();}

const API='https://script.google.com/macros/s/AKfycbzhTrysR8UYQyUpWiI-5BbZdNZpAdWzTsMpIB-6aB7m_4324AiYSoy4FlCKtVc1hqo9GA/exec';
const MOCK=new URLSearchParams(location.search).has('mock');
let code='',S=null,job=null,tick=null,mname='';const $=id=>document.getElementById(id);const m=$('m');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function toast(t,err){const e=$('toast');e.textContent=t;e.className='on'+(err?' err':'');clearTimeout(e._t);e._t=setTimeout(()=>e.className='',2600);}
async function call(body,ms){if(MOCK)return mock(body);const ac=new AbortController(),t=setTimeout(()=>ac.abort(),ms||45000);let r;
 try{r=await fetch(API,{method:'POST',body:JSON.stringify(body),signal:ac.signal});}catch(e){throw Error(e.name==='AbortError'?'Timed out — weak signal or server busy. Try again.':'No connection. Check signal and try again.');}finally{clearTimeout(t);}
 let j;try{j=await r.json();}catch(e){throw Error('Server error ('+r.status+'). Try again.');}if(j.error)throw Error(j.error);return j;}
function mock(b){const t=new Date(Date.now()-(2*3600+17*60)*1000).toISOString();if(b.action==='master')return{master:'WT Moore'};if(b.action==='photo')return{ok:true};if(b.action==='receipt')return{ok:true,url:'#'};
 return{name:'William Griffin',rate:30,jobs:['WT Moore'],open:{job:'WT Moore',in:'Sat Oct 24, 7:02 AM ET',inIso:t},weeks:[{week:weekNow(),hours:31.5,regular:31.5,overtime:0,pay:945,shifts:[{job:'WT Moore',in:'Fri Oct 23, 7:00 AM ET',out:'Fri Oct 23, 3:30 PM ET',hours:8.5}]}]};}
function weekNow(){const p=Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',weekday:'short'}).formatToParts(new Date()).map(x=>[x.type,x.value]));
 const d=new Date(Date.UTC(+p.year,p.month-1,+p.day));const back=(['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(p.weekday));d.setUTCDate(d.getUTCDate()-back);return d.toISOString().slice(0,10);}
// ---------- Login keypad ----------
function loginView(){m.innerHTML=`<div class="card" style="text-align:center;padding:28px 20px"><h2>Welcome back</h2><div class="mute">Enter your employee code</div>
<div class="dots" id="dots">${'<i></i>'.repeat(4)}</div><div class="pad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')}
<button class="ghost" onclick="key('c')">Clear</button><button onclick="key('0')">0</button><button class="ghost" onclick="key('b')">⌫</button></div></div>`;}
async function key(k){if(k==='c')code='';else if(k==='b')code=code.slice(0,-1);else if(code.length<4)code+=k;
 [...$('dots').children].forEach((d,i)=>d.className=i<code.length?'f':'');if(code.length===4){$('dots').innerHTML='<span class="spin dk"></span>';
 try{S=await call({action:'status',code});$('lo').style.display='';render();uploadAll();}catch(e){code='';loginView();$('dots').classList.add('shake');toast(e.message,1);}}}
// ---------- Main ----------
function fmtT(ms){const s=Math.max(0,Math.floor(ms/1000));return[Math.floor(s/3600),Math.floor(s/60)%60,s%60].map(n=>String(n).padStart(2,'0')).join(':');}
function render(){clearInterval(tick);const first=S.name.split(' ')[0];const w=S.weeks.find(x=>x.week===weekNow());
 if(tab==='support')return supportView();
 if(tab==='receipts')return receiptView();
 if(tab==='links')return linksView();
 if(tab==='checklist')return checklistView();
 let h=tabsHtml()+`<div class="up" id="up"></div><div class="card" style="margin-top:12px"><div class="row"><div><div class="mute">Hi ${esc(first)} 👋</div><h2>${S.open?'You’re on the clock':'Ready to start?'}</h2></div><span class="chip">$${S.rate}/hr</span></div>`;
 if(S.open){h+=`<div class="status" style="margin-top:14px"><span class="pulse"></span>${esc(S.open.job)} · since ${esc(S.open.in.replace(/^\w+ \w+ \d+, /,''))}</div><div class="timer" id="tm">00:00:00</div><div class="mute" style="margin-bottom:16px">Current shift</div>
  <button class="big out" id="pb" onclick="punch()">Clock out</button></div><div class="card" id="rooms"><div class="spin dk"></div></div>`;}
 else{if(!job)job=S.jobs[0];h+=`<div class="mute" style="margin-top:14px">Choose your job</div><div class="jobs">${S.jobs.map(j=>`<button class="job ${j===job?'sel':''}" onclick="job='${esc(j)}';render()"><span class="ic">🏫</span>${esc(j)}<span class="ck"></span></button>`).join('')}</div>
  <button class="big in" id="pb" onclick="punch()">Clock in</button></div>`;}
 const hrs=w?w.hours:0,pct=Math.min(100,hrs/40*100);
 h+=`<div class="card"><div class="row"><h2 style="font-size:17px">This week</h2><span class="mute">Mon–Sun</span></div><div class="stats"><div class="stat"><b>${hrs.toFixed(1)}</b><small>hours</small></div><div class="stat"><b>${(w?w.overtime:0).toFixed(1)}</b><small>overtime</small></div><div class="stat"><b>$${(w?w.pay:0).toFixed(0)}</b><small>gross pay</small></div></div>
 <div class="bar ${hrs>40?'ot':''}"><i style="width:0" data-w="${pct}"></i></div><div class="row mute" style="margin-top:6px;font-size:13px"><span>${hrs>=40?'Overtime pays 1.5× now':(40-hrs).toFixed(1)+' h to overtime'}</span><span>40 h</span></div></div>`;
 if(S.weeks.length)h+=`<div class="card"><details><summary class="row">History <span class="mute">${S.weeks.length} week${S.weeks.length>1?'s':''} ▾</span></summary>${S.weeks.map(x=>`<div style="margin-top:14px"><div class="row"><b>Week of ${x.week}</b><b>$${x.pay.toFixed(2)}</b></div><div class="mute" style="font-size:13px">${x.hours} h · reg ${x.regular} · OT ${x.overtime}</div>${x.shifts.map(s=>`<div class="shift"><span>${esc(s.job)}<br><span class="mute">${esc(s.in)} → ${esc(s.out.replace(/^\w+ \w+ \d+, /,''))}</span></span><b>${s.hours} h</b></div>`).join('')}</div>`).join('')}</details></div>`;
 m.innerHTML=h;requestAnimationFrame(()=>document.querySelectorAll('.bar i').forEach(b=>b.style.width=b.dataset.w+'%'));
 if(S.open){const t0=new Date(S.open.inIso).getTime(),f=()=>{const e=$('tm');if(e)e.textContent=fmtT(Date.now()-t0);};f();tick=setInterval(f,1000);renderRooms();}}
async function punch(){const b=$('pb'),wasOpen=S.open,lbl=b.textContent;b.disabled=true;b.innerHTML='<span class="spin"></span>';
 try{const n=wasOpen?(await allPhotos()).filter(p=>p.code===code&&p.inIso===wasOpen.inIso).length:0;S=await call({action:'punch',code,job,photos:n});render();toast(wasOpen?'Clocked out ✓':'Clocked in ✓');if(wasOpen)uploadAll();}
 catch(e){b.disabled=false;b.textContent=lbl;toast(e.message,1);}}
// ---------- Photo storage (IndexedDB, never the gallery) ----------
const DB=new Promise((ok,no)=>{const r=indexedDB.open('tsshours',1);r.onupgradeneeded=()=>{r.result.createObjectStore('photos',{keyPath:'id',autoIncrement:true});r.result.createObjectStore('rooms',{keyPath:'k'});};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error);});
async function tx(st,mode,fn){const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(st,mode),s=t.objectStore(st);const q=fn(s);t.oncomplete=()=>ok(q&&q.result);t.onerror=()=>no(t.error);});}
const allPhotos=()=>tx('photos','readonly',s=>s.getAll());
const sessKey=()=>code+'|'+(S&&S.open?S.open.inIso:'');
async function rooms(){const r=await tx('rooms','readonly',s=>s.get(sessKey()));return r?r.list:[];}
async function addRoom(){const n=$('roomNo').value.trim().replace(/[^\w .-]/g,'');if(!n)return toast('Enter a room number',1);const l=await rooms();if(!l.includes(n))l.push(n);await tx('rooms','readwrite',s=>s.put({k:sessKey(),list:l}));openRoom(n);}
async function renameM(){const n=prompt('Drive folder name for '+S.open.job+' (e.g. the school):',mname);if(!n)return;try{const r=await call({action:'master',code,job:S.open.job,name:n});mname=r.master;$('mname').textContent=mname;toast('Folder renamed ✓');}catch(e){toast(e.message,1);}}
let cur=null;
async function renderRooms(){const el=$('rooms');if(!el||!S.open)return;if(!mname){try{mname=(await call({action:'master',code,job:S.open.job})).master;}catch(e){mname=S.open.job;}}
 const ph=(await allPhotos()).filter(p=>p.inIso===S.open.inIso),l=await rooms();
 el.innerHTML=`<div class="row"><h2 style="font-size:18px">Rooms</h2><button class="chip" style="border:0" onclick="renameM()">📁 <span id="mname">${esc(mname)}</span> ✎</button></div><div class="sub" style="margin:4px 0 12px">Snap room photos — they upload to Drive when you clock out.</div>
 <div class="add" style="margin-top:0"><input id="roomNo" class="field" style="margin:0" inputmode="numeric" placeholder="Room number" onkeydown="if(event.key==='Enter')addRoom()"><button class="btn" onclick="addRoom()">Add</button></div>
 <div class="tiles">${l.map(r=>{const n=ph.filter(p=>p.room===r).length;return `<button class="tile empty" onclick="openRoom('${esc(r)}')">${n?'🗂️':'📷'}<span class="lbl" style="position:absolute"><b>Room ${esc(r)}</b>${n?n+' photo'+(n>1?'s':'')+' saved':'No photos yet'}</span></button>`;}).join('')}</div>${l.length?'':'<div class="empty-st"><div class="ei">🚪</div><b>No rooms yet</b>Add a room number to start taking photos.</div>'}`;}
async function openRoom(r){cur=r;const n=(await allPhotos()).filter(p=>p.inIso===S.open.inIso&&p.room===r).length;
 $('rooms').innerHTML=`<div class="row"><button class="link" style="padding:0" onclick="renderRooms()">‹ Rooms</button></div><h2 style="font-size:18px;margin:6px 0 4px">Room ${esc(r)}</h2>
 <div class="mute" id="pc" class="sub" style="margin-bottom:12px">${n?n+' photo'+(n>1?'s':'')+' saved · uploads at clock-out':'No photos yet'}</div>
 <label class="big" style="display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#2563eb"><span>📷 Take Photo</span><input type="file" accept="image/*" capture="environment" hidden onchange="fileShot(this)"></label><div class="dn">🔒 Photos upload automatically to TSS Google Drive · not saved to your phone</div>`;}
async function toJpeg(src,w,h){const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);c.getContext('2d').drawImage(src,0,0,c.width,c.height);return new Promise(ok=>c.toBlob(ok,'image/jpeg',0.75));}
async function save(blob){await tx('photos','readwrite',s=>s.add({code,inIso:S.open.inIso,room:cur,takenAt:new Date().toISOString(),blob}));const n=(await allPhotos()).filter(p=>p.inIso===S.open.inIso&&p.room===cur).length;toast('Photo '+n+' saved for Room '+cur);openRoom(cur);}
async function fileShot(i){const f=i.files[0];if(!f)return;try{const b=await createImageBitmap(f,{imageOrientation:'from-image'});await save(await toJpeg(b,b.width,b.height));}catch(e){toast('Could not save photo: '+e.message,1);}i.value='';}
const b64=b=>new Promise(ok=>{const r=new FileReader();r.onload=()=>ok(r.result.split(',')[1]);r.readAsDataURL(b);});
let uploading=false;
function upMsg(t,pct,err){const e=$('up');if(e)e.innerHTML=t?`<div class="upb${err?' err':''}">${err?'⚠️':pct<100?'<span class="spin dk" style="width:16px;height:16px;border-width:2px"></span>':'✅'}<span class="tx">${t}</span><i class="pg" style="width:${pct}%"></i></div>`:'';}
let wake=null;function retryNow(){if(wake)wake();else uploadAll();}
async function uploadAll(){if(uploading)return;uploading=true;let tries=0;const pend=p=>p.code===code&&!(S.open&&p.inIso===S.open.inIso);
 while(true){const ph=(await allPhotos()).filter(pend);if(!ph.length){if(tries){upMsg('All photos uploaded to Drive',100);toast('Photos uploaded ✓');setTimeout(()=>upMsg(''),4000);}break;}
  let done=0,why='';for(const p of ph){upMsg(`Uploading photos ${done}/${ph.length} · keep this open`,done/ph.length*100);
   try{await call({action:'photo',code,inIso:p.inIso,room:p.room,takenAt:p.takenAt,seq:p.id,job:S&&S.jobs?S.jobs[0]:undefined,data:await b64(p.blob)},90000);await tx('photos','readwrite',s=>s.delete(p.id));done++;}catch(e){why=e.message;}}
  tries++;const left=(await allPhotos()).filter(pend).length;if(left){const w=Math.min(60,5*tries);upMsg(`<span title="${esc(why)}">${left} photo${left>1?'s':''} didn’t upload · retry in ${w}s</span></span><button class="link" onclick="retryNow()">Retry now</button><span hidden>`,done/ph.length*100,1);await new Promise(r=>{wake=r;setTimeout(r,w*1000);});wake=null;}}
 uploading=false;}
// ---------- Tech Support ----------
let tab='clock',chat=[],askImgs=[],askVid=null,asking=false,askErr='';
function tabsHtml(){return `<div class="tabbar"><div class="tabs"><button class="${tab==='clock'?'on':''}" onclick="tab='clock';render()">⏱ Clock</button><button class="${tab==='support'?'on':''}" onclick="tab='support';render()">🛠 Support</button><button class="${tab==='receipts'?'on':''}" onclick="tab='receipts';render()">🧾 Receipts</button><button class="${tab==='links'||tab==='checklist'?'on':''}" onclick="tab='links';render()">🔗 Links</button></div></div>`;}
function md(t){const e=esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');let o='',list=null;
 for(const ln of e.split('\n')){const b=ln.match(/^\s*[-*•]\s+(.*)/),n=ln.match(/^\s*\d+[.)]\s+(.*)/),hd=ln.match(/^#{1,4}\s+(.*)/);const want=b?'ul':n?'ol':null;
  if(list&&want!==list){o+=`</${list}>`;list=null;}if(want&&!list){o+=`<${want}>`;list=want;}
  if(b||n)o+=`<li>${(b||n)[1]}</li>`;else if(hd)o+=`<h4>${hd[1]}</h4>`;else if(ln.trim())o+=`<p>${ln}</p>`;}
 return o+(list?`</${list}>`:'');}
function supportView(){clearInterval(tick);
 m.innerHTML=tabsHtml()+`<div class="up" id="up"></div><div class="card" style="margin-top:12px"><h2 style="font-size:18px">Tech Support</h2><div class="sub">Ask about installing displays, projectors, panels, mounts, cabling, HDMI/HDBaseT, audio or control. Add a photo to identify a part.</div>
 <div id="chat">${chat.length||asking?'':'<div class="empty-st" style="padding:4px 12px 16px"><div class="ei">🛠</div><b>How can we help?</b>Type, talk, or snap a photo of the install.</div>'}${chat.map(c=>`<div class="msg ${c.role==='user'?'u':'a'}">${c.role==='user'?esc(c.text)+(c.n?`<div class="mute" style="font-size:12px">📷 ${c.n} photo${c.n>1?'s':''}</div>`:''):md(c.text)}</div>`).join('')}${asking?'<div class="msg a"><span class="spin dk"></span> Thinking…</div>':''}</div>
 <textarea id="q" placeholder="${chat.length?'Ask a follow-up…':'e.g. How do I run HDBaseT from the wall plate to the projector?'}"></textarea>
 ${askErr?`<div class="err-box">⚠️ ${esc(askErr)} <button class="btn" style="height:36px;padding:0 14px;margin-left:auto" onclick="sendAsk()">Retry</button></div>`:''}
 <div class="chips">${askImgs.length?`<span class="chip">📷 ${askImgs.length} photo${askImgs.length>1?'s':''} <a href="#" onclick="askImgs=[];supportView();return false">✕</a></span>`:''}${askVid?`<span class="chip">🎥 Video${askVid.dur?' '+askVid.dur+'s':''} <a href="#" onclick="askVid=null;supportView();return false">✕</a></span>`:''}</div>
 <div class="tools"><label class="btn sec">📷 Photo<input type="file" accept="image/*" capture="environment" hidden onchange="askShot(this)"></label><label class="btn sec">🎥 Video<input type="file" accept="video/*" capture="environment" hidden onchange="askVidShot(this)"></label><button class="mic ${rec?'on':''}" id="mic" aria-label="Voice input" onclick="toggleMic()">🎤</button><button class="btn" onclick="sendAsk()" ${asking?'disabled':''}>Ask</button></div><div class="dn sm">🔒 Photos and videos go to Tech Support only · not saved to your phone</div>${chat.length?'<div style="margin-top:10px"><button class="link" style="padding:0" onclick="chat=[];supportView()">New conversation</button></div>':''}</div>`;
 const c=$('chat');if(c&&c.lastElementChild)c.lastElementChild.scrollIntoView({block:'nearest'});}
async function askShot(i){const f=i.files[0];i.value='';if(!f)return;try{const b=await createImageBitmap(f,{imageOrientation:'from-image'});const k=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext('2d').drawImage(b,0,0,c.width,c.height);
 askImgs.push(c.toDataURL('image/jpeg',0.7).split(',')[1]);const q=$('q').value;supportView();$('q').value=q;toast(askImgs.length+' photo'+(askImgs.length>1?'s':'')+' attached');}catch(e){toast('Could not attach photo',1);}}
function vidDur(f){return new Promise(res=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';v.muted=true;const done=d=>{URL.revokeObjectURL(u);res(d);};v.onloadedmetadata=()=>done(isFinite(v.duration)?v.duration:0);v.onerror=()=>done(0);setTimeout(()=>done(0),5000);v.src=u;});}
async function askVidShot(i){const f=i.files[0];i.value='';if(!f)return;try{const d=await vidDur(f);
 if(d>62||f.size>15e6)return toast('That video is too long ('+(d?Math.round(d)+'s':Math.round(f.size/1e6)+'MB')+'). Please record a shorter clip, under 60 seconds.',1);
 const b64=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(String(fr.result).split(',')[1]);fr.onerror=rej;fr.readAsDataURL(f);});
 if(b64.length>20e6)return toast('That video is too big. Please record a shorter clip, under 60 seconds.',1);
 askVid={data:b64,mime:(f.type||'video/mp4').split(';')[0],dur:Math.round(d)};const q=$('q').value;supportView();$('q').value=q;toast('Video attached');}catch(e){toast('Could not attach video',1);}}
async function sendAsk(){if(rec)rec.stop();const q=$('q').value.trim();if(!q&&!askImgs.length&&!askVid)return toast('Type a question',1);if(asking)return;
 const history=chat.map(c=>({role:c.role,text:c.text})),imgs=askImgs,vid=askVid;chat.push({role:'user',text:(q||(vid?'(video)':'(photo) What is this?'))+(vid&&q?' 🎥':''),n:imgs.length});askImgs=[];askVid=null;asking=true;supportView();
 askErr='';try{const r=await call({action:'ask',code,question:q,images:imgs,history,video:vid?{data:vid.data,mimeType:vid.mime}:undefined},vid?120000:60000);if(!r.answer)throw Error('Tech Support isn’t switched on yet. Ask Austin.');chat.push({role:'model',text:r.answer});chat=chat.slice(-12);}
 catch(e){chat.pop();askImgs=imgs;askVid=vid;askErr=e.message;}asking=false;supportView();if(askErr&&$('q'))$('q').value=q;}

let rec=null;
function toggleMic(){if(rec){rec.stop();return;}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return toast('Voice input isn’t supported here — tap the mic on your keyboard to dictate.',1);
 const r=new SR();r.lang='en-US';r.interimResults=true;r.continuous=true;const base=($('q').value.trim()+' ').trimStart();
 r.onresult=ev=>{let t='';for(let i=0;i<ev.results.length;i++)t+=ev.results[i][0].transcript;const q=$('q');if(q)q.value=base+t;};
 r.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed')toast('Microphone access was blocked — allow it in Settings, or use the keyboard mic.',1);};
 r.onend=()=>{rec=null;const b=$('mic');if(b)b.classList.remove('on');};
 try{r.start();rec=r;$('mic').classList.add('on');toast('Listening… tap 🎤 to stop');}catch(e){toast('Voice input isn’t supported here — tap the mic on your keyboard to dictate.',1);}}

// ---------- Receipts ----------
function linksView(){clearInterval(tick);
 m.innerHTML=tabsHtml()+`<div class="card" style="margin-top:12px"><h2 style="font-size:18px">Links</h2><div class="sub">Quick links for the job.</div>`+LINKS.map(l=>`<a ${l.tab?`href="#" onclick="tab='${l.tab}';render();scrollTo(0,0);return false"`:`href="${esc(l.url)}" target="_blank" rel="noopener" onclick="openLink(${LINKS.indexOf(l)});return false"`} style="display:flex;align-items:center;gap:14px;margin-top:10px;padding:16px;border-radius:16px;background:#fff;border:1px solid #e2e8f0;box-shadow:var(--sh);text-decoration:none;color:var(--ink)"><span style="font-size:28px">${l.icon}</span><span style="flex:1"><b style="display:block;font-size:16px">${esc(l.label)}</b><span class="mute" style="font-size:13px">${esc(l.sub||'')}</span></span><span class="mute" style="font-size:20px">›</span></a>`).join('')+`</div>`;}
let ck={room:'',tpl:'',done:{},busy:''};try{Object.assign(ck,JSON.parse(localStorage.ck||'{}'));ck.busy=''}catch(e){}
function ckSave(){localStorage.ck=JSON.stringify({room:ck.room,tpl:ck.tpl,done:ck.done})}
function ckKey(it){return ck.tpl+'|'+ck.room+'|'+it}
function checklistView(){clearInterval(tick);const items=CHECKLISTS[ck.tpl]||[],n=items.filter(i=>ck.done[ckKey(i)]).length,T=Object.keys(CHECKLISTS);
 const head=`<div class="up" id="up"></div><div class="card" style="margin-top:12px">`;let h;
 if(!ck.room||ck.edit){h=`<h2 style="font-size:18px">Checklist</h2><div class="sub">Type the room number to start.</div>
  <input id="ckroom" class="field" inputmode="numeric" enterkeyhint="next" maxlength="20" placeholder="Room number, e.g. 204" value="${esc(ck.room)}" onkeydown="if(event.key==='Enter'){event.preventDefault();ckNext()}">
  <button class="big" style="margin-top:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#2563eb" onclick="ckNext()"><span>Next →</span></button>`;}
 else if(!ck.tpl){h=`<div class="row"><div><div class="mute">Room ${esc(ck.room)} · <a href="#" onclick="ckRoom();return false" style="color:#2563eb">Change</a></div><h2 style="font-size:18px">Choose checklist type for Room ${esc(ck.room)}</h2></div></div>
  ${T.map((t,i)=>`<button class="big" style="margin-top:10px;height:64px;font-size:17px;background:#fff;color:var(--ink);border:1px solid #e2e8f0;box-shadow:var(--sh);display:flex;align-items:center;justify-content:space-between;padding:0 18px" onclick="ckPick(${i})"><span style="color:var(--ink);font-weight:700">☑️ ${esc(t)}</span><span style="color:#64748b;font-size:14px;font-weight:600">${(CHECKLISTS[t]||[]).length} items ›</span></button>`).join('')}`;}
 else{h=`<div class="row"><div><div class="mute">Room ${esc(ck.room)} · <a href="#" onclick="ckRoom();return false" style="color:#2563eb">Change</a></div><h2 style="font-size:18px">${esc(ck.tpl)} · <a href="#" onclick="ck.tpl='';ckSave();checklistView();return false" style="font-size:13px;font-weight:600;color:#2563eb">Change</a></h2></div><span class="chip" style="${n===items.length?'background:#dcfce7;color:#15803d':''}">${n}/${items.length}</span></div>
  ${items.map((it,i)=>{const d=ck.done[ckKey(it)],b=ck.busy===it;return `<div style="display:flex;align-items:center;gap:12px;margin-top:10px;padding:14px;border-radius:16px;background:${d?'#f0fdf4':'#fff'};border:1px solid ${d?'#86efac':'#e2e8f0'}"><span style="font-size:24px">${d?'✅':'⬜️'}</span><span style="flex:1"><b style="display:block;font-size:15px">${esc(it)}</b><span class="mute" style="font-size:12px">${esc(it)} (${esc(ck.room)}).jpg</span></span><label style="flex:none;padding:10px 12px;border-radius:12px;font-weight:700;font-size:14px;background:${d?'#fff':'linear-gradient(135deg,var(--brand),var(--brand2))'};color:${d?'#2563eb':'#fff'};border:1px solid #dbeafe">${b?'<span class="spin"></span>':d?'Retake':'📷 Photo'}<input type="file" accept="image/*" capture="environment" hidden ${ck.busy?'disabled':''} onchange="ckShot(this,${i})"></label></div>`}).join('')}<div class="dn">🔒 Photos upload automatically to TSS Google Drive · not saved to your phone</div>`;}
 m.innerHTML=tabsHtml()+head+h+`</div>`;if(!ck.room||ck.edit){const r=$('ckroom');r&&r.focus();}}
function ckNext(){const r=$('ckroom'),v=(r?r.value:'').trim();if(!v){r&&r.focus();toast('Type the room number first',1);return}if(v!==ck.room)ck.tpl='';ck.room=v;ck.edit=false;ckSave();checklistView();}
function ckRoom(){ck.edit=true;checklistView();}
function ckPick(i){ck.tpl=Object.keys(CHECKLISTS)[i];ckSave();checklistView();}
async function ckShot(inp,i){const f=inp.files[0];inp.value='';const it=(CHECKLISTS[ck.tpl]||[])[i];if(!f||!it||ck.busy)return;const room=ck.room;ck.busy=it;checklistView();
 try{const b=await createImageBitmap(f,{imageOrientation:'from-image'});const r=await call({action:'photo',code,inIso:S&&S.open?S.open.inIso:'',room,takenAt:new Date().toISOString(),seq:Date.now(),job:S&&S.open?S.open.job:(S&&S.jobs?S.jobs[0]:undefined),fname:it+' ('+room+')',data:await b64(await toJpeg(b,b.width,b.height))},90000);
  if(r&&r.error)throw new Error(r.error);if(r&&!r.name)alert('Uploaded, but the server is on an older version so the file name may not match. Tell Austin.');
  ck.done[ck.tpl+'|'+room+'|'+it]=1;ckSave();}catch(e){alert('Upload failed: '+e.message+' — try again.');}
 ck.busy='';checklistView();}
let rcpts=[],rcBusy=false;
function receiptView(){clearInterval(tick);const today=new Date().toDateString(),list=rcpts.filter(r=>r.day===today);
 m.innerHTML=tabsHtml()+`<div class="card" style="margin-top:12px"><h2 style="font-size:18px">Receipts</h2><div class="sub">Snap a receipt — it uploads to Expenses in Drive.</div>
 <input id="rnote" class="field" maxlength="60" placeholder="Note (optional), e.g. Home Depot">
 <label class="big" style="display:grid;place-items:center;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#2563eb"><span>${rcBusy?'<span class="spin"></span> Uploading…':'📷 Take Photo'}</span><input type="file" accept="image/*" capture="environment" hidden ${rcBusy?'disabled':''} onchange="receiptShot(this)"></label><div class="dn">🔒 Photos upload automatically to TSS Google Drive · not saved to your phone</div>

async function receiptShot(i){const f=i.files[0];i.value='';if(!f||rcBusy)return;const note=($('rnote').value||'').trim();rcBusy=true;receiptView();$('rnote').value=note;
 try{const b=await createImageBitmap(f,{imageOrientation:'from-image'});const r=await call({action:'receipt',code,note,data:await b64(await toJpeg(b,b.width,b.height))});
  rcpts.unshift({day:new Date().toDateString(),time:new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}),note,url:r.url||'#'});toast('Receipt uploaded');rcBusy=false;receiptView();}
 catch(e){rcBusy=false;receiptView();$('rnote').value=note;toast('Upload failed: '+e.message,1);}}

loginView();
if(MOCK){code='7340';call({}).then(async s=>{S=s;$('lo').style.display='';await tx('rooms','readwrite',x=>x.put({k:sessKey(),list:['101','102','204']}));
 const c=document.createElement('canvas');c.width=400;c.height=400;const g=c.getContext('2d');for(const [r,col] of [['101','#93c5fd'],['204','#fcd34d']]){const gr=g.createLinearGradient(0,0,400,400);gr.addColorStop(0,col);gr.addColorStop(1,'#e2e8f0');g.fillStyle=gr;g.fillRect(0,0,400,400);
 const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg'));await tx('photos','readwrite',x=>x.add({code,inIso:S.open.inIso,room:r,takenAt:new Date().toISOString(),blob}));}render();}).catch(e=>{document.title="ERR "+e.message;});}
